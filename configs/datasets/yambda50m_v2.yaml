dataset:
  name: yambda50m
  repo_id: yandex/yambda
  repo_type: dataset
  revision: dd6f3a19eef5866e346c3270e098baa641a44948
  format: flat
  size: 50m
  root: data/raw/yambda
  files:
    - flat/50m/listens.parquet
    - flat/50m/likes.parquet
    - flat/50m/dislikes.parquet
    - artist_item_mapping.parquet
    - README.md

events:
  primary: listens
  positive_rule: played_ratio_pct > 50
  timestamp_unit: seconds
  timestamp_precision_seconds: 5
  day_id: timestamp // 86400

audit:
  base_anchor_candidates_days: [180, 210, 225, 240, 255, 270]
  update_window_candidates: [12h, 1d, 3d, 7d]
  release_gap_seconds: 1800
  paired_unit: user
  bootstrap_replicates: 2000
  output_dir: results/data_audit/yambda50m_v2

protocol_status: frozen_for_canary
