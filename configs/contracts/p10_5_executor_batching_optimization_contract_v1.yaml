contract: p10_5_executor_batching_optimization_contract_v1
status: frozen_before_optimized_executor_implementation_or_measurement
purpose: reduce_mixed_action_fragmentation_without_changing_any_frozen_scheduler_assignment

inputs:
  scheduler_freeze_sha256: b569a8713cdeafb37786e065b69567d1122760612c4d49d42274c7615dc1cf88
  reference_runtime_evaluator_sha256: a16addea5cc8fd0f165947bb5313f11800f22f6bcd7679031ef4eec6a33153b1
  reference_runtime_seal_sha256: c5ea5b462985a29ece0ebcbbbf311b9afe73c91e1ea0fe28f04b973fc35dc7ee

immutable_semantics:
  policy_assignment_per_uid: unchanged
  probe_sample_per_uid: unchanged
  probe_actions_and_order: unchanged
  final_cache_action_per_uid: unchanged
  token_layer_and_IO_accounting: unchanged
  model_checkpoint_and_precision: unchanged

optimization:
  group_key: [effective_prefix_length, operation_signature]
  operation_signature:
    sampled_state: five_probe_actions
    unsampled_state: selected_action
  skip_noop_kernel_and_raw_history_read: true
  batch_size: 16
  allowed: [reordering_independent_states, fuller_action_batches, skipping_zero_work_noop]
  prohibited: [changing_action, changing_probe_rate, changing_budget, approximate_kernel, quality_aware_batching]

numeric_canary:
  condition: {release: r2, model: m1, seed: 17, sample_fraction: 0.01, budget_fraction: 0.10}
  states: 128
  selection: sha256_uid
  compare: per_uid_final_K_and_V_reference_vs_grouped
  max_abs_tolerance: 1.0e-5
  exact_shape_and_uid_conservation: required

runtime_replay:
  conditions: same_ten_conditions_as_P10_2
  repetitions: 3
  GPUs: [0, 1]
  report: [before_runtime, after_runtime, speedup, logical_work, operation_batch_counts, raw_reconstruction, H2D]

stop_gate:
  canary_failure: stop_without_full_replay
  assignment_or_numeric_change: stop
  full_success: freeze_executor_then_prepare_version_debt_and_scale_contracts

evidence_boundary:
  scheduler_retuning: prohibited
  quality_label_read: prohibited
  production_kernel_claim: prohibited
  theta3_blind_edge: prohibited
