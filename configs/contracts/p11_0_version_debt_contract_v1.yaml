interpretation:
  DirectAge2Diagnostic_is_deployable_lineage: false
  RecursiveMixed_is_deployable_NoOp_lineage: true
  edge2_one_hop_is_not_called_accumulated_debt: true

next_if_canary_passes:
  - batch_recursive_append_by_current_state_length
  - run_all_models_and_seeds
  - apply_frozen_scheduler_without_retuning

prohibited:
  - theta3_blind_edge
  - scheduler_or_action_retuning
  - future_label_selection
