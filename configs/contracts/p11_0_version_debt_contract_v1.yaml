  DirectAge2Diagnostic: theta0_full_on_edge2_prefix_scored_by_theta2
  RecursiveMixed:
    materialize: theta0_on_edge1_cutover_prefix_once
    service_between_releases: append_each_event_with_theta1_and_rolling_cap_512
    evaluate: resulting_mixed_theta0_theta1_state_scored_by_theta2

scope:
