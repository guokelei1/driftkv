contract: p7_7_theta0_training_contract_v1
date_frozen: 2026-08-19
depends_on: [p7_4_training_contract_v1, p7_6_base_fit_result_v1]
status: frozen_theta0_training_authorized

authorization:
  real_data_preflight: true
  train_models: [M0-N, M0-R, M0-F, M1]
  train_theta0_only: true
  qualification_read_or_scoring: false
  theta1_theta2: false
  staleness_or_controller: false

inputs:
  manifest_root: data/manifests/p7_full_v1
  residual_train_index_sha256: 5a24def8a2ef9e51fc78f52b5a0882564e2661bb291392ff40e02b36eb3645ea
  development_index_sha256: 7685c1fb42b445e1c8f31cd1b8e852630d87e68e9e40d3b668c3f382f8a20e93
  qualification_index_sha256: 61f86afefe2dd32eca33b625fd7af1338fdd1f4850550ca4a3d968d1170a3857
  frozen_base_bundle_sha256: 4221f0b95245bb6b3a735c86d4cdb2603c6a7d8b173c7cac7c3dd5e28a64e42c
  training_views: {N: quality, R: quality_rankable, F: quality}

model:
  class: HSTU_candidate_conditioned_residual
  num_layers: 4
  hidden_size: 128
  num_heads: 4
  context: Full-512_only
  block_variant: legacy
  activation: elu_plus1
  gating: silu_gate
  causal_diagonal: inclusive
  relative_position_bias: false
  temporal_num_freqs: 16
  temporal_max_period_seconds: 86400
  input_dropout: 0.1
  attention_dropout: 0.0
  query_types: {N: 0, R: 1, F: 2}
  query_action_id: 0
  cc_score_head: shared_scalar_head
  candidate_query_transient: true
  query_writes_persistent_kv: false

deployment_score:
  formula: stopgrad_frozen_base_plus_cc_residual
  base_gradient: forbidden
  base_refit_or_update: forbidden
  residual_mixing_coefficient: fixed_1
  post_training_score_mixing_search: forbidden

optimizer:
  type: AdamW
  learning_rate: 0.0002
  weight_decay: 0.0001
  epochs: 3
  logical_query_batch_size: 8
  microbatch_size: {N: 4, R: 1, F: 8}
  candidate_chunk_size: {N: 25, R: 16, F: 1}
  gradient_clip_norm: null
  autocast: bfloat16_on_cuda
  seeds: [17, 37, 71]
  shuffle: deterministic_full_permutation_per_task_epoch
  query_presentations_per_task_seed: 11817
  no_history_dropout_or_recent_mix: true

objectives:
  N: user_weighted_request_listwise_ce
  R: user_weighted_request_listwise_ce_complete_familiar_universe
  F: user_weighted_binary_logistic_ce_natural_labels
  M0: corresponding_task_only
  M1:
    schedule: strict_round_robin_N_R_F_logical_batches
    task_weight: one_third_each
    task_loss: user_weighted_request_normalized
    candidate_rows_do_not_weight_task_or_request: true
    raw_loss_magnitude_rescaling: forbidden
  auxiliary_H_or_old_history_losses: forbidden

preflight:
  models: [M0-N, M0-R, M0-F, M1]
  fixed_real_queries_per_task: 32
  optimizer_steps: {M0: 20, M1: 30}
  retained_checkpoint: false
  may_change_contract_from_curve: false
  required:
    - deployment_score_equals_base_plus_residual
    - base_hash_unchanged_and_no_base_grad
    - encoder_query_and_candidate_embeddings_have_grad
    - finite_loss_decreases_on_fixed_subset
    - nonzero_residual_variance
    - candidate_permutation_equivalence
    - R_chunked_equals_full_on_fixed_small_request
    - request_weight_not_candidate_row_weight
    - F_natural_labels_and_direction
    - qualification_locked

checkpoint_selection:
  supersedes_p7_4_final_step_rule_due_to_explicit_p7_7_authorization: true
  eligible_epochs: [1, 2, 3]
  development_only: true
  M0: minimum_corresponding_task_deployment_loss
  M1: minimum_equal_one_third_N_R_F_development_loss
  tie_break: earliest_epoch
  one_shared_checkpoint_for_all_M1_tasks: true
  forbidden_metrics:
    - Full_minus_Recent
    - target_free_H
    - old480_contribution
    - qualification_quality
    - future_staleness

dev_sanity:
  comparisons: [Frozen_Base_Only, Frozen_Base_plus_M0_Full512, Frozen_Base_plus_M1_Full512]
  recent32_or_H_evaluation: prohibited
  M0_gate:
    - deployment_dev_primary_loss_better_than_base_only
    - finite_nonzero_residual
    - candidate_content_sensitivity
    - base_bundle_hash_unchanged
  M1_gate:
    - every_task_nonzero_residual_and_training_gradient
    - R_or_F_positive_increment_over_base_only
    - every_task_better_than_no_information_control
    - one_checkpoint_executes_all_tasks

retention:
  retain_selected_checkpoint_per_model_seed: true
  retain_nonselected_epoch_checkpoints: false
  retain_optimizer_state: false
  retain_step_logs_and_selection_trace: true
  retain_preflight_checkpoint: false

stop_after: frozen_theta0_bundle_and_dev_sanity
