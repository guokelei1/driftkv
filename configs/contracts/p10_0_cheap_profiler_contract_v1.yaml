contract: p10_0_cheap_profiler_contract_v1
status: frozen_before_any_profiler_fit_or_policy_assignment
purpose: test_whether_cutover_features_plus_charged_sparse_probes_can_approximate_the_sealed_offline_state_action_frontier

inputs:
  p9_7_population_cost_sha256: c4bf0f652bfe09ca6f2dad73175522781bc3d20bb34bab3b1c698dbf181afcd7
  p9_8_all_state_fidelity_sha256: 626cfd3840904cae1d20d1ee6484e6bce11334e9d319b9228fa032b5af237b0f
  edge1_state_manifest_sha256: d12d4c5352a549f1a4fec638000e59e251c3b2f6c6e45c687bd7bc230b7bab95
  edge2_state_manifest_sha256: 5aa590325e9d52161ab148821fe7c539622f0a2d5a8d16eb19e4387502d49124
  post_seal_oracle_reference_sha256: 0efe2dd920f91c23bf47353aa7171ee010e608a521daf11a5c1210b2a19107a4

scope:
  releases: [r0, r1_edge1, r1_edge2, r2]
  models: [m0_f, m1]
  seeds: [17, 37, 71]
  cells: 24
  gpu_required: false
  cpu_workers: 12
  all_frozen_seeds_retained: true

release_gate:
  r0_cache_producer_changed: false
  r0_action: noop
  r0_probe_budget: 0
  non_r0_cache_producer_changed: true

features:
  source: release_cutover_state_manifest_only
  columns:
    - log1p_effective_prefix_length
    - log1p_last_activity_age_seconds
    - log1p_events_last_1d
    - log1p_events_last_7d
    - log1p_events_last_30d
    - log1p_unique_items_last_7d
    - organic_ratio_last_7d
    - repeat_ratio_last_7d
  future_requests: prohibited
  future_activity: prohibited
  feedback_label: prohibited
  heldout_quality: prohibited
  CurrentExact_loss_for_unsampled_states: prohibited

probe:
  deterministic_selection: ascending_sha256_of_release_model_seed_uid
  sample_fractions: [0.01, 0.02]
  nested_samples: true
  measured_actions: [layer0_recent128, layer0_middle, layer0_full, hybrid_tail128, exact_all]
  sampled_state_terminal_action: exact_all
  charged_work: sum_of_all_measured_action_token_layer_costs
  probe_outputs_are_target_free: true

predictor:
  family: StandardScaler_plus_Ridge
  alpha: 1.0
  solver: lsqr
  separate_regression_per_action: true
  target: sampled_noop_MSE_minus_sampled_action_MSE
  target_scale: sample_mean_noop_MSE
  coefficient_or_feature_search: prohibited
  cross_validation: prohibited

allocation:
  actions: [noop, layer0_recent128, layer0_middle, layer0_full, hybrid_tail128, exact_all]
  budgets_exact_fraction: [0.05, 0.10, 0.25]
  cost_axis: exact_equivalent_recomputed_token_layers
  calibration_cost_charged_before_allocation: true
  method: per_state_predicted_upper_concave_hull_then_global_greedy_marginal_benefit_per_token_layer
  exact_solver_claim: false
  posthoc_threshold_or_action_search: prohibited

canary:
  semantic_cells:
    - {release: r0, model: m1, seed: 17}
    - {release: r2, model: m1, seed: 17}
  gates:
    - r0_assigns_only_noop_and_spends_zero
    - deterministic_nested_probe_samples
    - budget_conservation_including_probe_work
    - assignment_schema_contains_no_label_or_actual_loss
    - repeated_execution_is_identical

sealing:
  policy_assignments_before_quality_join: required
  forbidden_assignment_columns: [label, target, future, mse, actual_loss, quality]
  post_seal_oracle_comparison: allowed
  post_seal_heldout_quality_join: separate_step_only

evidence_boundary:
  phase: development_profiler_canary
  offline_oracle_is_not_a_deployable_feature: true
  sampled_exact_probes_are_explicitly_charged: true
  controller_training: prohibited
  theta3_or_blind_qualification: prohibited
