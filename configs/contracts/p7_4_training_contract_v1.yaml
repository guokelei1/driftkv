return_variable_candidate_contract_v1:
  primary_candidate_universe: complete_unique_items_in_causal_512_prefix
  sampling_or_quality_based_cap: forbidden
  history_prefix_computations_per_request: 1
  candidate_attention: independent_transient_query_rows
  execution: exact_microbatch_chunks
  cross_chunk_normalizer: streaming_logsumexp
  padding_logit: negative_infinity
  loss_reduction: request_mean_then_user_equal_total_weight
  invariants:
    - score_matches_unchunked_for_chunk_sizes_1_intermediate_and_full
    - loss_matches_unchunked_listwise_ce
    - chunk_and_candidate_order_do_not_change_aligned_scores_or_loss
    - padding_never_changes_loss
    - target_is_present_exactly_once
    - candidate_count_never_changes_request_weight
  system_cap_policy: >-
    No cap is currently authorized. If a canary exceeds the frozen memory
    envelope, a new contract may set a cap from memory measurements only,
    before model-quality results are observed.

m0_m1_objective_contract_v1:
  shared:
    architecture: 4_layers_hidden128_4_heads_context512
    base_scorer: same_task_specific_frozen_base
    candidate_protocol: same_per_workload
    query_type_table: three_types_N_R_F
    optimizer: adamw_lr_0.0002_weight_decay_0.0001
    seeds: [17, 37, 71]
    checkpoint_rule: final_registered_step_only
    qualification_early_stopping: forbidden
    qualification_model_selection: forbidden
    per_task_unique_query_budget_rule: >-
      K equals the number of quality-evaluable rankable R residual_train
      requests after the frozen coverage audit. Every task/model sees exactly
      K deterministic request samples per seed; N/F are user-balanced sampled
      without using labels or H, and R uses every rankable request once.
    frozen_unique_query_K: 3939
    compute_matching:
      strict_compute_matched: false
      reason: candidate_count_and_history_work_differ_by_task
      M1_extra_cross_task_supervision_is_intended_treatment: true
      budget_table_required_before_training: true
  M0:
    models: [single_task_N, single_task_R, single_task_F]
    encoder_sharing_across_tasks: false
    objective: one_task_only
  M1:
    models: [shared_multitask_N_R_F]
    encoder_sharing_across_tasks: true
    task_sampling: exact_equal_K_requests_per_task
    objective: one_third_times_sum_of_request_normalized_N_R_F_losses
    per_task_user_equal_total_weight: true
  only_primary_difference: independent_single_task_encoder_vs_shared_multitask_encoder
  forbidden_auxiliary_objectives:
    - full_beats_recent_loss
    - old_history_attention_reward
    - H_maximization
    - history_only_score
    - state_distillation_designed_to_increase_H

base_dev_sanity_when_later_authorized:
  N_R: [listwise_log_loss, target_pairwise_auc, ndcg, hr, mrr]
  F: [log_loss, roc_auc, dislike_pr_auc, macro_calibration, per_class_calibration]
  controls: [random_for_N_R, majority_for_F, registered_single_features]
  compare_full_vs_recent: false
  qualification_opened: false

forbidden:
  - alter_time_splits_from_H
  - select_lambda_on_development_or_qualification
  - oversample_dislikes
  - generate_unobserved_feedback_negatives
  - sample_R_candidates_for_the_primary_protocol
  - train_HSTU_before_P7_5_manifest_canary_passes
