base_fitter_v1:
  capacity: task_specific_convex_linear
  intercept: true
  interaction_terms: false
  trees_or_non_linear_fusion: false
  residual_mixing_coefficient: fixed_1
  objectives:
    N: request_mean_listwise_softmax_ce
    R: request_mean_listwise_softmax_ce_over_complete_familiar_universe
    F: user_weighted_binary_logistic_loss_on_observed_like_dislike
  labels:
    F_natural_like_dislike_ratio: true
    F_oversampling: false
    F_synthetic_unobserved_negatives: false
  feature_transforms:
    counts: log1p
    recency_seconds: log1p
    proposal_rank_if_defined: log1p
    continuous_clip_quantiles_from_base_fit_only: [0.005, 0.995]
    standardization_mean_std_from_base_fit_only: true
    std_floor: 1.0e-8
    missing_continuous_value_after_transform: 0.0
    missing_indicator_required: true
  schemas:
    N:
      - log1p_item_count
      - log1p_artist_count
      - log1p_item_recency_seconds
      - log1p_artist_recency_seconds
      - log1p_global_popularity_at_base_fit_cutoff
      - item_history_missing
      - artist_history_or_mapping_missing
    R:
      - log1p_item_count
      - log1p_artist_count
      - log1p_item_recency_seconds
      - log1p_artist_recency_seconds
      - log1p_global_popularity_at_base_fit_cutoff
      - log1p_causal_proposal_rank
      - artist_missing
    F:
      - log1p_item_count
      - log1p_artist_count
      - log1p_item_recency_seconds
      - log1p_artist_recency_seconds
      - log1p_global_popularity_at_base_fit_cutoff
      - item_history_missing
      - artist_history_or_mapping_missing
  proposal_rank_availability:
    N: >-
      Omitted. The retained legacy N quality/fidelity sources do not preserve
      one common causal proposal-rank field, and P7 must not reconstruct one
      from the injected target or panel position.
    R: deterministic_count_recency_item_id_rank_is_defined
    F: not_defined_for_observed_feedback_candidate
  regularization:
    kind: l2_coefficients_only
    convention: loss_plus_lambda_over_2_times_squared_l2
    lambda_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
  blocked_cv_inside_base_fit:
    base_fit_seconds: [0, 15552000]
    blocks_days: [[0, 45], [45, 90], [90, 135], [135, 180]]
    forward_folds:
      - {train_days: [0, 45], validate_days: [45, 90]}
      - {train_days: [0, 90], validate_days: [90, 135]}
      - {train_days: [0, 135], validate_days: [135, 180]}
    selection: minimum_equal_fold_mean_primary_loss
    tie_break: larger_lambda
    refit_after_selection: all_base_fit
  solver:
    family: deterministic_scipy_lbfgsb
    max_iterations: 1000
    ftol: 1.0e-12
    gtol: 1.0e-8
  weighting:
    loss_unit: request
    each_user_equal_total_weight_within_task: true
    candidate_rows_never_weight_requests: true
  freeze_artifacts:
    - feature_schema
    - clipping_bounds
    - scaler_mean_std
    - selected_lambda
    - coefficients_and_intercept
    - base_fit_row_and_user_manifest_hash
    - fitter_contract_hash

