next_contract_required_before_full_manifests:
  status: satisfied_by_p7_5_materialization_contract_v1
  reason: >-
    Naively materializing every N base-fit or qualification query with 100
    candidates would create a large redundant corpus and would conflict with
    the repository retention policy. Freeze deterministic user-level
    evaluation sampling, streaming base fitting, sharding, and retention
    before generating any full manifest.
  must_define:
    - N_R_F_training_row_selection_under_frozen_K_3939
    - user_level_dev_and_qualification_evaluation_sampling
    - streaming_base_fit_without_large_jsonl_materialization
    - shard_size_and_checksums
    - temporary_artifact_cleanup_and_retention

