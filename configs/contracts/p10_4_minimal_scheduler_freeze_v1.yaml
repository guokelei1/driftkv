contract: p10_4_minimal_scheduler_freeze_v1
status: frozen_after_P10_3_equal_cost_gate_and_before_executor_optimization
purpose: freeze_the_minimal_EvoKV_release_time_scheduler_for_future_qualification

authorization_input:
  p10_3_result_sha256: d75f4650ae4e4b1c6f22fc3edad81850b9693d5e9eff6695432e444f2324e27a
  p10_3_contract_sha256: 2528932f9e30491d322682e46599d4bed124231039ebe7293b434d51fb4abb89
  p10_3_global_gate_passed: true
  passed_release_model_conditions: 6_of_6

release_gate:
  cache_producer_unchanged: noop_all_without_probe
  cache_producer_changed: run_sparse_profiler_and_budget_allocator

probe:
  primary_rate: 0.01
  selection: ascending_sha256_of_release_model_seed_uid
  measured_actions: [layer0_recent128, layer0_middle, layer0_full, hybrid_tail128, exact_all]
  sampled_state_terminal_action: exact_all
  charge_all_probe_action_work: true
  companion_rate: 0.02
  companion_complete_reporting: required
  production_universal_one_percent_claim: prohibited
  scale_sensitivity_future: compare_one_percent_with_fixed_count_or_capped_rate_without_retuning_on_blind_edge

features:
  source: release_cutover_state_manifest_only
  columns:
    - log1p_effective_prefix_length
    - log1p_last_activity_age_seconds
    - log1p_events_last_1d
    - log1p_events_last_7d
    - log1p_events_last_30d
    - log1p_unique_items_last_7d
    - organic_ratio_last_7d
    - repeat_ratio_last_7d
  future_request_or_label_feature: prohibited

predictor:
  preprocessing: StandardScaler_fit_on_probe_states
  family: Ridge
  alpha: 1.0
  solver: lsqr
  separate_regression_per_action: true
  target: sampled_noop_MSE_minus_sampled_action_MSE
  target_scale: sample_mean_noop_MSE
  GBDT_or_complex_model_search: prohibited

actions:
  ordered: [noop, layer0_recent128, layer0_middle, layer0_full, hybrid_tail128, exact_all]
  dependency_closed: true
  new_action_after_freeze: prohibited

allocator:
  budgets_exact_fraction: [0.05, 0.10, 0.25]
  primary_cost: exact_equivalent_recomputed_token_layers
  method: per_state_predicted_upper_concave_hull_then_global_greedy_marginal_benefit_per_token_layer
  exact_solver_claim: false
  tie_break:
    state: ascending_uid
    action: frozen_action_order
  calibration_cost_deducted_before_migration: true

quality_safety:
  future_labels_used_for_selection: false
  mandatory_companions: [aggregate_logloss, ROC_AUC, dislike_PR_AUC, Brier, dislike_only_logloss]
  dislike_attribution: [CurrentExact_vs_Noop, Policy_vs_CurrentExact]
  blind_noninferiority_criterion: must_be_frozen_with_blind_evaluation_contract
  model_release_gate_and_cache_gate_separate: true

executor_boundary:
  action_assignment_is_immutable_during_batching_optimization: true
  allowed_optimization: semantics_preserving_grouping_buffer_reuse_and_clone_reduction
  numeric_equivalence_canary_required: true
  before_and_after_runtime_both_reported: true

qualification_boundary:
  development_scheduler: frozen
  production_scheduler: not_claimed
  theta3_blind_edge: still_preserved
  blind_execution_requires_full_stack_executor_freeze: true
