  probe_cost_included: true
  sampled_states_receive: exact_all
  allocation: concave_hull_greedy_fixed_tie_break
  same_cost_baselines:
    - best_uniform_action
    - longest_prefix_exact_first
    - oldest_state_exact_first
    - most_active_30d_exact_first
    - most_unique_items_7d_exact_first
