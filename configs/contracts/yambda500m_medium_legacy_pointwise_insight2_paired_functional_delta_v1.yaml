contract: yambda500m_medium_legacy_pointwise_insight2_paired_functional_delta_v1
date_frozen: 2026-09-02
status: prospective_recursive_paired_functional_delta_canary_v1
purpose: >-
  Test whether a sparse cross-version functional delta can causally construct
  its own upper-layer continuation. The decisive contrast keeps users,
  carriers, weights, Parent control state, Current reader and serving read
  fixed, and changes only whether earlier paired response defects are visible
  to later carriers.

