    assignment: nearest_center_Voronoi
    candidate_or_label_input: none
    qualification_tuning: prohibited
  causal_mass:
    serving_read: complete_cluster_mass_at_cutover
    carrier_read: prefix_valid_partial_mass_only
    future_center_visible_to_earlier_carrier: false
    selected_carriers_processed_in_source_position_order: true
  primary_layer0_prefix_mode: paired_closure
  primary_recurrence: >-
    full causal Parent response plus response of earlier paired
    Current-minus-Parent carriers, followed by the native Current block
  exact_Current_layer0_prefix_mode: legal_consistency_ablation_only
  Current_Exact_upper_layer_KV_in_legal_constructor: prohibited
  native_signed_atoms:
    Current_arm: generated_Current_carrier_KV
    Parent_arm: references_existing_Parent_KV_at_same_source_positions
