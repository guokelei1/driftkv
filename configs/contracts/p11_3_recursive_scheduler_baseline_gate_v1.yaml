contract: p11_3_recursive_scheduler_baseline_gate_v1
status: frozen_after_assignment_seal_and_before_same_cost_adjudication
purpose: test_frozen_state_level_scheduler_transfer_on_true_recursive_lineage

inputs:
  p11_1_adjudication_sha256: e2ed245f0dfc7b80681b3f50c9ea363af429d8bc5e40e262cbb6fb525196ab31
  p11_2_contract_sha256: 136d7bad226ba5dce5ea08877395a7c47381a3ac48cca65fa19c46b0d499cf38
  p11_2_assignment_seal_sha256: 06b1fbc6ce7284d522fb3b08cf3df10846c6f39396f9991839c9213057698598

primary_policy:
  probe_fraction: 0.01
  budgets_exact_fraction: [0.05, 0.10, 0.25]
companion_policy:
  probe_fraction: 0.02
  complete_reporting: required

same_charged_cost_baselines:
  strongest_deterministic_definition: best_of_feasible_uniform_and_four_metadata_exact_orders
  feasible_uniform_actions: all_frozen_actions
  metadata_exact_orders:
    - longest_effective_prefix_first
    - oldest_state_first
    - most_active_30d_first
    - most_unique_items_7d_first
  random_exact_repetitions: 20
  offline_near_optimal: upper_bound_only

uncertainty:
  paired_user_bootstrap_repetitions: 2000
  independent_repeat: training_seed

gate:
  per_model_passes_if_at_any_primary_budget:
    - Ridge_minus_strongest_deterministic_equal_seed_mean_is_positive
    - at_least_two_of_three_seed_differences_are_positive
  models_adjudicated_independently: true
  all_seed_results_required: true
  bootstrap_CIs_required: true

evidence_boundary:
  target_free_development: true
  quality_labels_read: false
  scheduler_retuning: prohibited
  theta3_blind_edge: prohibited
