contract: p9_7_full_population_contract_v1
status: frozen_before_materialization
purpose: separate_release_time_state_population_from_future_request_evaluation

inputs:
  p9_5_result_sha256: 19093e668e9b546ad62d759ef16a1ff5eae9b9edf6594c23d29845c55a4759e4
  p9_6_result_sha256: 4c4b041090e4b7395d5d0bc534dbda3242544e93431b07e2b8518483ce70d31e
  p9_6_cost_artifact_sha256: 8795b56cfe91aa475fcd7f58134dc2ffab50bcc4632231024c3268091defd368
  raw_listens_sha256: eed9cbd094af1e189507d2f8132a0dc9653b90e65480125c7cdccd601e0592d1
  p8_materialization_summary_sha256: 5c6c88e02e29ddeba99a742bc3e5490191c3547a21d18075dd0162d4206218e7

populations:
  migration_primary:
    definition: every_user_with_at_least_one_strictly_pre_cutover_listen
    unit: one_materialized_state_per_uid
    require_future_request: false
    require_future_activity: false
    require_future_label: false
    weighting_primary: uniform_per_state
    weighting_companion: pre_cutover_activity_only
  heldout_request_evaluation:
    definition: frozen_P8_F_quality_and_fidelity_requests
    role: validate_query_visible_fidelity_and_quality_only
    may_define_migration_population: false
    may_supply_policy_features: false

edges:
  edge1: {cutover: 19958400, pre_release_candidate_sources: [update1_train]}
  edge2: {cutover: 21168000, pre_release_candidate_sources: [update1_train, update2_train]}

state:
  history_cap: 512
  order: raw_parquet_physical_order_within_uid
  timestamps: strictly_less_than_cutover
  behavior_mapping: organic_1_recommendation_2
  raw_pointer_required: true
  pre_release_features:
    - effective_prefix_length
    - last_activity_age_seconds
    - events_last_1d
    - events_last_7d
    - events_last_30d
    - unique_items_last_7d
    - repeat_ratio_last_7d
    - organic_ratio_last_7d

cutover_probe:
  role: label_free_release_time_profiler_input
  query_type: F
  candidate_count: 16
  candidate_pool: empirical_candidate_multiset_from_pre_release_F_train_manifests
  per_state_sampling: deterministic_sha256_edge_uid_position_with_collision_resolution
  future_target_injection: false
  labels_materialized: false
  primary_readout: raw_CC_residual_score_vector
  target_free_metrics: [normalized_score_RMS, pairwise_inversion, score_shift_quantiles]
  exact_CurrentFull_for_all_states_is_offline_oracle_only: true
  deployable_profiler_may_exact_sample_only: true

execution_semantics:
  migration_action_once_per_uid_at_cutover: true
  later_queries_share_the_evolved_state: true
  post_cutover_listens_append_once_in_chronological_order: true
  rolling_cap: 512
  future_requests_do_not_change_action_choice: true

authorization:
  snapshot_and_probe_materialization: true
  uid_keyed_executor_canary: after_materialization_audit
  all_state_exact_probe_run: false
  scheduler: false
  theta3: false
