contract: p7_6_base_fit_contract_v1
date_frozen: 2026-08-19
depends_on: p7_5_full_result_v1
status: frozen_base_fitting_authorized

authorization:
  base_fit_read: true
  development_base_only_read: true
  qualification_read_or_scoring: false
  hstu_or_cc_training: false
  theta1_theta2_training: false

inputs:
  manifest_root: data/manifests/p7_full_v1
  base_fit_index_sha256: 9872429928b801259e8d1cd87407026508c863a2413b39674f798a95dbeb7a0b
  development_index_sha256: 7685c1fb42b445e1c8f31cd1b8e852630d87e68e9e40d3b668c3f382f8a20e93
  qualification_index_sha256: 61f86afefe2dd32eca33b625fd7af1338fdd1f4850550ca4a3d968d1170a3857
  training_views:
    N: quality
    R: quality_rankable
    F: quality

feature_transform:
  features: exactly_p7_4_feature_whitelist
  clip_quantiles: [0.005, 0.995]
  fold_scaler: fit_on_forward_fold_training_blocks_only
  final_scaler: fit_on_all_base_fit
  standardization: clipped_mean_and_std
  std_floor: 1.0e-8
  missing_policy: already_materialized_value_plus_indicator
  future_or_non_base_statistics: forbidden

models:
  N:
    objective: user_weighted_request_listwise_softmax_ce
    intercept: fixed_zero_because_listwise_shift_is_unidentifiable
  R:
    objective: user_weighted_request_listwise_softmax_ce_complete_familiar_universe
    intercept: fixed_zero_because_listwise_shift_is_unidentifiable
  F:
    objective: user_weighted_binary_logistic_ce
    intercept: fitted
    natural_label_ratio: true
    oversampling: false
  interactions_or_trees: forbidden

regularization:
  type: l2_coefficients_only
  grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
  objective: loss_plus_lambda_over_2_times_squared_l2
  forward_folds:
    - {train_blocks: [0], validate_block: 1}
    - {train_blocks: [0, 1], validate_block: 2}
    - {train_blocks: [0, 1, 2], validate_block: 3}
  lambda_selection: minimum_equal_fold_mean_primary_loss
  tie_break: larger_lambda
  boundary_selection: report_without_grid_expansion
  final_refit: all_base_fit
  solver: deterministic_scipy_lbfgsb
  max_iterations: 1000
  ftol: 1.0e-12
  gtol: 1.0e-8

weighting:
  inferential_unit: user
  fit: equal_total_weight_per_user_within_current_train_fold
  validation: equal_total_weight_per_user_within_validation_fold
  candidate_count_does_not_change_request_weight: true

streaming_equivalence_canary:
  selection: deterministic_128_requests_per_task_from_base_fit
  compare:
    - reconstructed_feature_rows
    - request_weights
    - objective_and_gradient
    - final_coefficients
    - fixed_development_raw_scores
  coefficient_atol: 1.0e-7
  score_atol: 1.0e-7
  objective_gradient_atol: 1.0e-9

development_sanity:
  selection_or_early_stopping_on_development: forbidden
  N_R_controls: [intercept_random, base_fit_selected_single_feature, frozen_base]
  N_R_metrics:
    - listwise_ce
    - within_request_pairwise_auc
    - target_hard_negative_margin
    - conditional_ndcg_at_10
    - hr_at_10
    - mrr
  R_required_denominators: [all_eligible_session_starts, rankable_familiar_returns, coverage]
  F_controls: [prevalence_intercept, base_fit_selected_single_feature, frozen_base]
  F_metrics: [log_loss, roc_auc, pr_auc_like, pr_auc_dislike, brier]
  F_required_cohorts:
    - like_dislike
    - prior_30m_same_item
    - non_prior_30m
    - latest_item
    - organic
    - recommendation_driven
  bootstrap:
    unit: user
    draws: 1000
    seed: 7601
  single_feature_selection:
    source: all_base_fit_only
    rule: minimum_unregularized_primary_loss_after_univariate_fit
    development_selection: forbidden

pass_gate:
  - all_parameters_features_scores_finite
  - streaming_equivalence_passes
  - frozen_base_beats_intercept_on_primary_continuous_dev_metric
  - candidate_score_variance_positive
  - R_complete_candidate_universe_preserved
  - F_label_direction_valid
  - qualification_loader_remains_locked
  - base_logits_identical_for_recent32_and_full512

artifacts_root: results/p7/base_fit
stop_after: frozen_base_bundle_and_development_sanity
