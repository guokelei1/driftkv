contract: yambda500m_medium_hstu_native_insight1_locality_v1
date_frozen: 2026-09-01
status: prospective_medium_insight1_locality_v1
purpose: >-
  Measure the optimistic theoretical-KV-coverage versus label-free functional
  recovery frontiers of layer, sparse-token, and continuous-window Exact-KV
  splices on every frozen Medium D14 adjacent release edge.

scope:
  scale: EvoKV-HSTU-M
  seed: 17
  architecture: hstu_native_cc
  versions: [v0, v1, v2, v3, v4, v5]
  edges: [v0_to_v1, v1_to_v2, v2_to_v3, v3_to_v4, v4_to_v5]
  cutover_days: [231, 245, 259, 273, 287]
  users: 3000
  history_positions: 1024
  candidate_probes_per_user: 64
  new_training: false
  serving_lineage_promotion: prohibited

model:
  hidden_size: 192
  num_layers: 6
  num_heads: 6
  max_seq_len: 1024
  known_items: 1380509
  oov_buckets: 256

population:
  eligibility: at_least_1024_listens_strictly_before_day231
  selector: ascending_existing_label_free_selector_rank_then_uid
  selected_count: 3000
  fixed_across_all_edges: true
  labels_read: prohibited
  audited_eligible_users_at_day231: 21200
  history_snapshot: last_1024_events_strictly_before_each_edge_cutover

candidate_panel:
  width: 64
  recent_region_positions: [768, 1024]
  recent_repeat: up_to_16_most_recent_unique_known_items_from_recent_region
  old_only_repeat: up_to_16_most_recent_unique_known_items_from_positions_0_to_767_excluding_recent_region
  novel_to_prefix: fill_to_64_from_globally_frequent_known_history_items_absent_from_user_prefix
  global_bank_source: selected_users_same_edge_pre_cutover_history_only
  query_timestamp: edge_cutover
  candidate_specific_state_mask: prohibited
  labels_or_negative_semantics: prohibited

diagnostic_intervention:
  type: exact_kv_splice
  producer_states: [Parent_exact_prefix_KV, Current_exact_prefix_KV]
  selected_unit: layer_by_history_position
  selected_values: replace_both_K_and_V_for_all_heads
  unselected_values: retain_Parent_K_and_V
  dependency_closed_action: false
  scale_frontier_admission: prohibited
  cost_axis: selected_token_layer_units_divided_by_6_times_1024
  selector_discovery_cost_in_axis: excluded
  real_flops_or_runtime_interpretation: prohibited

layer_family:
  layer_numbering: one_based_in_reports_zero_based_in_code
  groups:
    - [1]
    - [2]
    - [3]
    - [4]
    - [5]
    - [6]
    - [1, 2]
    - [3, 4]
    - [5, 6]
    - [1, 2, 3]
    - [3, 4, 5]
    - [4, 5, 6]
    - [1, 2, 3, 4]
    - [3, 4, 5, 6]

window_family:
  intervals_half_open:
    - [896, 1024]
    - [768, 896]
    - [640, 768]
    - [768, 1024]
    - [512, 768]
    - [256, 512]
    - [512, 1024]
    - [256, 1024]

token_family:
  mask_scope: per_user_candidate_shared_all_layers_all_heads_both_K_and_V
  tie_break: score_descending_then_position_recency_descending
  aggregation: per_candidate_layer_head_L1_history_normalization_then_equal_mean
  budgets:
    p10: {positions: 102, selectors: [ATTN_MASS, READ_NORM, PERSISTENCE, KV_DRIFT, READ_DELTA]}
    p20: {positions: 205, selectors: [ATTN_MASS, READ_NORM, KV_DRIFT, READ_DELTA]}
    p40: {positions: 410, selectors: [READ_NORM, READ_DELTA]}
    p80: {positions: 819, selectors: [READ_DELTA]}
  selectors:
    ATTN_MASS: Current_query_Parent_K_pointwise_attention_mass
    READ_NORM: Current_query_Parent_KV_weighted_value_contribution_norm
    PERSISTENCE: frequency_in_candidate_layer_head_attention_top102
    KV_DRIFT: Current_minus_Parent_K_and_V_position_norm
    READ_DELTA: Current_Exact_minus_Reuse_weighted_value_contribution_norm
  current_exact_aware_diagnostic_selectors: [KV_DRIFT, READ_DELTA]
  executable_policy_claim_for_current_exact_aware_selectors: prohibited

metrics:
  primary_gap: mean_absolute_probability_gap_to_Current_Exact
  primary_recovery: one_minus_ratio_of_mean_gap_to_Reuse_mean_gap
  recovery_clipping: prohibited
  robustness:
    - mean_absolute_logit_gap_to_Current_Exact
    - mean_Bernoulli_JS_to_Current_Exact
    - top1_agreement_with_Current_Exact
    - top10_overlap_with_Current_Exact
    - within_user_rank_correlation_with_Current_Exact
  aggregation:
    - every_edge_reported
    - best_observed_per_edge_family_budget
    - mean_min_max_per_edge_family_budget
    - edge_equal_best_observed
    - globally_fixed_config_edge_equal
  labels_in_raw_or_primary_analysis: prohibited

runtime:
  physical_gpus: [0, 1, 2, 3]
  world_size: 4
  parallelism: independent_UID_shards_on_four_GPU_ranks
  edges_within_rank: serial
  parent_and_current_cache_generation: once_per_user_edge
  hybrid_cache_persistence: prohibited
  candidate_chunking: benchmark_before_formal
  batch_size: benchmark_before_formal
  cache_dtype: checkpoint_native_fp32
  aggregate_dtype: fp64

focused_canary:
  users: 32
  all_five_edges: required
  all_34_locality_configs: required
  anchors: [Reuse, Current_Exact]
  empty_mask_reproduces_Reuse_max_abs_logit_error: 0.00002
  full_mask_reproduces_Current_Exact_max_abs_logit_error: 0.00002
  selected_and_unselected_tensor_copy_errors: 0
  finite_scores: required
  resource_and_makespan_estimate_before_formal: required

protocol:
  future_labels: prohibited
  outcome_based_population_candidate_budget_or_selector_tuning: prohibited
  target_KV_predictor_fitting: prohibited
  selected_edge_reporting: prohibited
  all_frozen_configs_reported: required
  exact_KV_splice_is_diagnostic_only: required
  raw_scores_sealed_before_analysis: required
  overwrite_existing_evidence: prohibited

