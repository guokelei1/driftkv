contract: yambda50m_v1
status: invalidated_for_calendar_time_analysis
superseded_by: configs/contracts/yambda50m_v2.yaml

data:
  source_manifest: data/manifests/yambda50m_v1.json
  primary_event: listens
  positive_rule: played_ratio_pct > 50
  user_filter: users_with_base_update_future_and_at_least_5_base_events
  item_catalog: ids_seen_in_base_training_window
  artist_mapping: artist_item_mapping.parquet

time:
  timestamp_representation: 5_second_bins
  base_days: 300
  release_gap_minutes: 30
  primary_update_window_days: 3
  robustness_update_window_days: 7
  rejected_update_window_days: [1]
  stability_anchors_days: [300, 450, 600, 750, 900, 1050, 1200]

endpoints:
  first_legal_request: first_request_after_release_gap_with_known_user
  dilution_requests: [1, 2, 4, 8, 16]
  online_lineage: old_prefix_then_current_model_append_in_timestamp_order

candidate_protocol:
  status: pending_implementation
  primary: frozen_popularity_cooccurrence_retrieval
  reference: fixed_catalog_canary
  candidates_frozen_before_model_comparison: true

model_canary:
  versions: [theta0, theta1, theta2]
  baselines: [random, popularity, no_history_hstu, full_history_hstu]
  state_paths: [current_full, previous_full, reuse, no_history]
  claims_allowed: [history_sensitive_execution, cache_lineage_correctness, recompute_cost_measurement]
  claims_disallowed: [sota_algorithm_comparison, every_edge_positive_gap]
