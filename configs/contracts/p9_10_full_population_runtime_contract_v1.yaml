scope:
  population: every_materialized_state_at_cutover
  benchmark_conditions:
    - {name: edge1_m0_r2_seed17, edge: edge1, release: r2, model: m0_f, seed: 17}
    - {name: edge1_m1_r2_seed17, edge: edge1, release: r2, model: m1, seed: 17}
    - {name: edge2_m1_r1_edge2_seed17, edge: edge2, release: r1_edge2, model: m1, seed: 17}
  actions: [noop, layer0_recent128, layer0_middle, layer0_full, hybrid_tail128, exact_all]
  rationale: runtime_depends_on_architecture_and_state_lengths_not_quality_effect_size

batching:
  exact_effective_prefix_length_groups: true
  batch_size: 16
  padding_or_candidate_requests: false
  full_population_repetitions: 3
  global_warmup_batches_per_action: 1
  precision: float32
  GPU_allowlist: [0, 1]
  CPU_threads: 24

timing_boundaries:
  migration_GPU_kernel_wall:
    includes: [transition_action_kernels, returned_cache_materialization, CUDA_synchronization]
    excludes: [checkpoint_load, raw_Parquet_reconstruction, host_to_device_raw_copy, parent_cache_reference_build, query_scoring, future_append]
  raw_source_reconstruction_wall: reported_separately
  raw_history_host_to_device_wall: reported_separately
  parent_cache_reference_build_wall: diagnostic_excluded_from_deployment_migration
  PCIe_proxy:
    pinned_host_full_cache_H2D_and_D2H: measured
    storage_KV_IO: logical_bytes_only_not_claimed_as_measured_storage

canary:
  condition: edge1_m1_r2_seed17
  states: 128
  selection: sha256_uid
  require_mixed_prefix_lengths: true
  repetitions: 2
  gates:
    finite_nonnegative_timings: true
    state_and_action_conservation: true
    logical_work_matches_frozen_cost_function: true

evidence_boundary:
  prototype_PyTorch_executor_not_production_kernel: true
  all_state_exact_role: offline_cost_endpoint
  scheduler: prohibited
  paper_qualification: false
