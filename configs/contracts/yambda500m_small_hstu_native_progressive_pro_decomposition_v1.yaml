date_frozen: 2026-08-28
status: prospective_label_free_progressive_PRO_error_decomposition_v1
purpose: determine_whether_lightweight_PRO_error_is_direction_or_amplitude_dominated_and_whether_two_fixed_probes_and_segment_scalar_decay_are_supported

scope:
  scale: EvoKV-HSTU-S
  seed: 17
  edges: [v0_to_v1, v1_to_v2, v2_to_v3, v3_to_v4, v4_to_v5]
  cutover_days: [231, 245, 259, 273, 287]
  new_training: false
  development_evidence_only: true
  request_labels: prohibited
  quality_adjudication: prohibited
  lineage_promotion: prohibited
  scale_action_admission: prohibited

fixed_samples:
  cutover:
    users_per_edge: 64
    selection: first_64_population_selector_order_users_with_full_512_pre_cutover_history
    history: last_512_events_strictly_before_cutover
    candidate_bank: frozen_controlled_width_64_panel
    query_time_delta: 0
  rolling:
    users_per_edge_maximum: 64
    selection: first_64_population_selector_order_users_with_full_cutover_history_and_at_least_two_real_exposed_groups
    requests_per_user: [first_eligible, last_eligible]
    candidate_bank: largest_available_real_exposed_width_in_2_4_8_16
    request_order: query_before_same_timestamp_append
    state_transition: Current_appends_to_both_Current_Exact_and_Parent_Reuse_lineages_with_rolling_cap_512
  focused_canary:
    users_per_edge: 8
    cutover_and_rolling: required
    all_five_edges: required

mechanism_under_diagnosis:
  serving_base: Parent_persistent_KV
  materialized_version_translated_prefix_positions: 0
  carrier_count: 32
  repair_window: latest_128_pre_cutover_events
  carrier_partition: deterministic_consecutive_groups_with_endpoint_anchor_and_explicit_mass
  carrier_dependency_source: unmodified_Parent_prefix_first_384_positions
  fixed_candidate_independent_probes:
    - latest_pre_cutover_history_item
    - oldest_item_in_latest_128_pre_cutover_window
  probe_query_time_delta: 0
  stage: av_aggregation
  two_probe_combination:
    direction: normalized_sum_of_per_probe_unit_directions_per_layer
    old_amplitude: mean_projection_of_the_two_old_coordinate_components_onto_shared_direction
    recent_amplitude: mean_projection_of_the_two_recent_context_components_onto_shared_direction
  rolling_scalar_rules:
    legacy_global: max_0_512_minus_evictions_divided_by_512
    segment_old: max_0_384_minus_evictions_divided_by_384
    segment_recent: one_until_384_evictions_then_max_0_128_minus_additional_evictions_divided_by_128
  persisted_action:
    direction_scalars: 4_layers_times_128
    amplitude_scalars: 4_layers_times_2_segments
    total_FP32_scalars: 520

exact_oracle:
  source: coherent_Current_Exact_minus_Parent_Reuse_candidate_mean_AV_aggregation_correction
  allowed_use: label_free_error_decomposition_only
  prohibited_use: [target_KV_fitting, serving_action, request_or_edge_selection, quality_claim]

frozen_metrics:
  layerwise:
    - direction_cosine_to_exact_shared_AV
    - estimated_to_exact_norm_ratio
    - relative_L2_to_exact_shared_AV
    - oracle_projection_amplitude_relative_L2
    - fixed_probe_direction_cosine
    - fixed_probe_norm_ratio
    - old_to_recent_component_direction_cosine
  score_fidelity_without_labels:
    - mean_absolute_logit_gap_to_Current_Exact
    - mean_absolute_probability_gap_to_Current_Exact
    - probability_gap_recovery_over_Reuse
  comparisons:
    cutover: [single_latest_probe, dual_probe]
    rolling: [single_probe_global_decay, dual_probe_global_decay, dual_probe_segment_decay]
  aggregation:
    - every_edge_reported
    - request_weighted_edge_medians
    - non_weighted_five_edge_mean
    - cutover_and_rolling_reported_separately

prefrozen_interpretation_rules:
  stable_direction:
    threshold_median_cosine: 0.90
    minimum_edges_at_cutover: 4
    minimum_edges_at_rolling: 4
  amplitude_dominant_error:
    oracle_projection_relative_L2_reduction_minimum: 0.25
    minimum_edges_at_cutover: 4
    minimum_edges_at_rolling: 4
  two_probe_consistency:
    median_direction_cosine_minimum: 0.90
    median_norm_ratio_interval: [0.5, 2.0]
    minimum_edges: 4
  segment_decay_selection:
    condition: dual_probe_segment_decay_relative_L2_not_above_dual_probe_global_decay_on_at_least_4_edges_and_lower_five_edge_mean
    on_pass: freeze_segment_decay_for_progressive_frontier
    on_failure: retain_global_decay_and_preserve_negative_result
  component_rule:
    second_component_allowed_only_if: two_probe_median_direction_cosine_below_0.90_on_at_least_2_edges
    otherwise: one_persistent_direction_per_layer

progression:
  on_valid_diagnostic: freeze_one_progressive_PRO_frontier_contract_before_frontier_execution
  next_frontier_carriers: [32, 48, 64]
  next_frontier_probes: 2
  expected_budget_names: [approximately_10_percent, approximately_15_percent, approximately_20_percent]
  formal_quality: new_training_seed_or_new_frozen_release_edge_only
  same_five_edge_labels_for_formal_claim: prohibited

protocol:
  raw_first: true
  compact_aggregates_only: true
  expanded_KV_output: prohibited
  future_labels: prohibited
  sampled_or_synthetic_negatives: prohibited
  raw_request_items_are_not_interpreted_as_negatives: true
  probe_carrier_coverage_or_threshold_tuning_after_results: prohibited
  semantic_GROUP_embedding_selector_per_candidate_route_history_basis_PCA_SVD: prohibited

