contract: scale_8l_hs_v1
date_frozen: 2026-08-23
status: re_frozen_after_canary_only_relative_output_path_serialization_failure_no_metrics_revealed
purpose: reproduce_long_state_and_cross_version_staleness_at_8L_H256_context1024
evidence_level: development_scale_pilot_single_seed_not_paper_qualification

scope:
  dataset: Yambda-50M
  workload: F_explicit_feedback
  model: m0_f
  seed: 17
  releases: [r1_edge1, r1_edge2, r2]
  views: [quality, target_free_fidelity]

data_access:
  source: sealed_P8_development_release_edge_manifests
  qualification_or_theta3: false
  labels_enter_score_generation: false
  quality_metadata_joined_after_quality_population_logits_are_computed: true
  quality_and_fidelity_populations_scored_independently: true
  failed_canary_invalidation:
    population_assumption_failure:
      failure_stage: before_model_load_or_any_HS_score
      invalid_assumption: equal_counts_imply_equal_request_ids
      correction: preserve_each_frozen_view_and_run_the_same_label_free_executor_separately
    relative_path_serialization_failure:
      scope: deterministic_canary_only
      failure_stage: after_fidelity_logits_before_manifest_or_any_metrics
      correction: resolve_output_path_before_writing_relative_artifact_paths

lineage:
  state_population: users_with_a_nonempty_parent_state_at_release_cutover
  materialize_once_per_uid_at_cutover: true
  exact_state_at_cutover: current_model_on_last_1024_pre_cutover_events
  reuse_state_at_cutover: parent_model_on_the_same_last_1024_events
  append_between_release_and_query: every_listen_strictly_before_query_under_current_model
  query_mutates_persistent_state: false
  rolling_cap: 1024
  eviction: before_each_append
  reuse_state_across_all_uid_queries: true

paths:
  H_request_local:
    comparison: RequestLocalCurrentFull1024_vs_CurrentRecent32
    purpose: confirm_each_released_model_still_uses_history_before_the_latest_32_events
  S_rolling:
    comparison: CurrentExactRolling_vs_ReuseParentRolling
    purpose: measure_deployable_cross_version_state_incompatibility
  release_quality:
    comparison: RequestLocalCurrentFull1024_vs_PreviousFull1024
    purpose: keep_model_update_quality_separate_from_cache_compatibility
  request_local_full_vs_exact_rolling:
    role: mandatory_execution_semantics_companion_not_a_blocking_identity_gate
    reason: rolling_KV_retains_contextualized_tokens_after_eviction_while_request_local_recompute_does_not
  base_logits:
    bitwise_identical_between_Full1024_and_Recent32: required

statistics:
  within_seed_repeat_unit: uid
  bootstrap_replicates: 2000
  confidence_interval: percentile_95
  panels: 4
  panel_assignment: sha256_request_id_mod_4
  formal_cross_seed_claim: false

gates:
  numeric_floor_JS: 1.0e-8
  H_probability_floor: 1.0e-7
  H:
    JS_user_CI_lower_above_floor: true
    absolute_probability_difference_user_CI_lower_above_floor: true
  S:
    JS_user_CI_lower_above_floor: true
    minimum_panels_above_floor: 3
  quality_harm_from_reuse:
    role: companion_not_required_for_S_existence
  mandatory_quality_companions:
    - aggregate_log_loss
    - ROC_AUC
    - dislike_PR_AUC
    - Brier
    - dislike_only_log_loss

canary:
  deterministic_users_per_edge: 8
  require_all_scores_finite: true
  require_Base_Full_Recent_delta_zero: true
  require_each_view_population_integrity_and_one_candidate_per_request: true
  require_true_uid_rolling_lineage: true
  request_local_full_vs_exact_rolling: report_only

authorization:
  per_edge_HS_pass: frozen_partial_actions_may_be_replayed_on_that_edge
  per_edge_HS_fail: stop_that_edge_before_partial_action_or_scheduler_replay
  no_automatic_cross_seed_replication: true
  theta3: prohibited

