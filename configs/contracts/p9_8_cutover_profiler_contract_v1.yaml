contract: p9_8_cutover_profiler_contract_v1
status: frozen_before_execution
purpose: obtain_offline_all_state_action_fidelity_oracle_on_release_time_label_free_probes

inputs:
  p9_7_population_contract_sha256: 12799e6f40a9a9713e88ff9055a757ae9a51d61204c57859498612f42d5598b5
  p9_7_population_audit_sha256: 227d922d650b0bc71ef33a6b76ea2f4199105b0b9378969ddf0aac0472bbb5e7
  p9_7_uid_canary_sha256: 6714d070948296e029d181bed71057a173154030698d008193991fcbd8989bfa
  p9_7_population_cost_sha256: c4bf0f652bfe09ca6f2dad73175522781bc3d20bb34bab3b1c698dbf181afcd7
  p9_7_materialization_sha256: f44dc812fcb1735cc684f41eebbde10b0b54e576c327984c466cf41ba73c8235
  state_transition_source_sha256: 3e9e921cbbe599233ea1e6060d0c5a8f9480047db58f5641f4aa11d458354e92

scope:
  releases: [r0, r1_edge1, r1_edge2, r2]
  models: [m0_f, m1]
  seeds: [17, 37, 71]
  cells: 24
  population: all_materialized_states_at_cutover
  edge_mapping: {r0: edge1, r1_edge1: edge1, r1_edge2: edge2, r2: edge1}
  actions: [noop, layer0_recent128, layer0_middle, layer0_full, hybrid_tail128, exact_all]
  candidate_count: 16
  labels_or_future_requests_read: false

readout:
  query_type: F
  query_timestamp: release_cutover
  score: raw_CC_residual_logit
  base_logit: omitted_same_across_actions
  primary_loss: per_state_mean_squared_score_difference_to_CurrentExact
  normalized_score_RMS: sqrt_mean_squared_difference_divided_by_current_score_RMS_plus_1e-8
  pairwise_inversion: fraction_of_candidate_pairs_with_opposite_strict_order_excluding_current_ties
  companions: [normalized_score_RMS, pairwise_inversion, P95_absolute_score_shift]

execution:
  one_parent_and_current_cache_per_uid: true
  action_applied_once_at_cutover: true
  batch_states_only_with_equal_effective_prefix_length: true
  batch_size: 16
  precision: float32
  GPU_allowlist: [0, 1]

gates:
  canary_cells: [r0_m0_f_seed17, r2_m0_f_seed17]
  canary_states_per_cell: 128
  exact_max_abs_logit: 1.0e-5
  r0_all_action_max_abs_logit: 1.0e-5
  full_matrix_after_canary_only: true

evidence_boundary:
  all_state_exact_scores: offline_oracle_only
  deployable_profiler_exact_scope: sampled_states_only
  heldout_future_requests: validation_only
  scheduler: prohibited
  raw_scores_sealed_before_adjudication: required
