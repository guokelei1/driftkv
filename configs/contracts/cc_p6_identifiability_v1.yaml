contract: cc_p6_identifiability_v1
status: branch_b_yambda_next_item_nogo
does_not_rejudge: cc_p5_seenmix_v1
authorizes:
  cc_theta0_v3: false
  cc_theta1_theta2: false
  controller: false
  tomography: false
  theta3: false

# P6.0 — P5 remains a failed development protocol.
cc_p5_seenmix_v1:
  quota_feasibility: passed
  membership_shortcut_reduced: true
  primary_simple_feature_auc: 0.789
  primary_identifiability_gate: failed
  matched_diagnostic:
    status: invalid_for_conditional_identifiability
    reason: coarse_bins_leave_continuous_count_recency_imbalance
  frozen_quotas:
    m_recent: 16
    m_old: 24
    m_discovery: 59
  cannot_change_quotas: true
  cannot_change_mix: true
  cannot_change_loss: true
  cc_theta0_v3_authorized: false

forbidden:
  - train_cc_theta0_v3
  - change_16_24_59_quotas
  - change_qmain_or_seenmix_mix
  - change_loss
  - open_update_index_2
  - train_theta1_theta2
  - relax_p5_auc_ceilings

p6_1_simple_features:
  split: grouped_5fold_by_uid
  companion_time_split: v1_fit_v2_eval
  primary_metric: request_conditioned_cauc
  also_report: [global_binary_auc, ndcg@10, hr@10, mrr, target_rank_percentile]
  preprocess_fit_on_train_fold_only: true
  forbid_panel_slot_features: true
  forbid_candidate_row_random_split: true
  ablations:
    - seen_flag
    - log1p_item_count
    - log1p_artist_count
    - last_seen_recency_days
    - log1p_global_popularity
    - log_proposal_rank
    - all

p6_2_dropped_cohort:
  source: v1_plus_v2_development_queries
  compare: [retained_complete_quota, dropped_incomplete_quota]
  fields:
    - prefix_length
    - recent_unique
    - old_unique
    - last_activity_age
    - target_stratum
    - organic_ratio

p6_3_continuous_matched:
  name: Q_continuous_matched_diag_v2
  not_a_serving_workload: true
  design_window: v1_window
  holdout_window: v2_window
  strata: [recent_seen, old_only, unseen]
  match_within_stratum_only: true
  competitors_per_request: 8
  features:
    - log1p_item_count
    - log1p_artist_count
    - last_seen_recency_days
    - artist_last_seen_recency_days
    - log1p_global_popularity
    - log_proposal_rank
  distance: equal_weight_zscore_euclidean
  caliper_grid: [0.25, 0.5, 1.0, 1.5, 2.0]
  caliper_selected_on: design_balance_only
  caliper_objective: min_mean_abs_smd_among_feasible
  feasible_if:
    min_complete: 400
    min_per_stratum: 80
    max_abs_smd: 0.25
  holdout_gates:
    max_simple_feature_cauc: 0.60
    max_abs_smd: 0.25
    min_complete: 400
    min_per_stratum: 80
  cannot_tune_matching_on_holdout_auc: true

p6_4_no_injection:
  generator: frozen_seenmix_16_24_59
  target_injected: false
  report:
    - recall_at_seenmix_panel
    - recall_at_100_qmain
    - recall_at_1000_qmain
    - retrieved_target_simple_cauc
  strata: [recent_seen, old_only, unseen]

branch_a_requires:
  - grouped_and_request_conditioned_metrics_reported
  - holdout_matched_cauc_le_0_60
  - holdout_balance_ok
  - holdout_coverage_ok
  - no_injection_has_no_severe_new_anomaly
  then: freeze_cc_candidate_protocol_v2_do_not_rejudge_p5

branch_b_if:
  - continuous_match_fails_holdout_gate
  - or_coverage_collapses
  then: yambda_next_item_long_kv_qualification_no_go
