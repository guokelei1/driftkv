stage_taxonomy:
  architecture_neutral_order:
    - input_representation
    - qkv_projection
    - query_key_interaction
    - positionwise_value_response
    - aggregated_context
    - transformed_attention_or_gated_update
    - post_block_residual
    - final_query_or_user_representation
    - readout
  first_canary_adapter:
    s3_positionwise_value_response:
      hstu_name: kv_prefix_contribution
      caveat: intervention_sums_history_before_injection_and_cannot_localize_a_positionwise_executable_boundary
    s4_aggregated_context: {hstu_name: av_aggregation}
    s5_transformed_update: {hstu_name: u_gated_update}
    s6_post_block_residual: {hstu_name: layer_hidden}
    s7_final_representation: {hstu_name: final_readout}
  readout_low_dimension_as_insight: prohibited

trace_semantics:
  coherent_native_paths: required
  same_hidden_counterfactual_paths: required_for_causal_intervention
  roles:
    history_producer_state: Parent_or_Current_prefix_KV
    request_reader_state: Current_query_and_transient_self_KV
  rank0_estimator: signed_anchor_candidate_mean_delta
  rank0_role: PRO_compatible_representation_baseline_not_PRO_estimator
  low_rank_ranks: [1, 2, 4, 8]
  low_rank_status: required_after_rank0_instrumentation_canary
  full_exact_delta: oracle_correctness_ceiling_only
  diagnostic_exact_state_or_stage_delta_as_scale_action: prohibited

metrics:
  primary:
    - anchor_to_heldout_probability_gap_recovery
    - anchor_to_heldout_logit_gap_recovery
  robustness:
    - Bernoulli_JS_to_Current_Exact
    - top1_agreement_with_Current_Exact
    - top10_overlap_with_Current_Exact
    - within_user_rank_correlation_with_Current_Exact
  structure:
    - uncentered_and_candidate_centered_spectrum
    - rank_at_90_and_95_percent_energy
    - participation_ratio_effective_rank
    - token_head_layer_error_energy_and_topk_coverage
    - candidate_mean_energy_fraction
  recovery_clipping: prohibited
  every_edge_reported: required

gates:
  instrumentation:
    native_and_reconstructed_max_abs_logit_error: 0.00002
    full_delta_intervention_max_abs_logit_error: 0.00002
    finite_all_paths: required
    labels_read: false
  functional_boundary:
    edge_equal_mean_recovery_at_least: 0.80
    ordinary_rule_edges_at_or_above_0_80: 4
    tolerance_rule_edges_at_or_above_0_90: 3
    tolerance_rule_edge_equal_mean_still_at_least: 0.80
    scalar_readout_only: fail
  persistence:
    fixed_cutover_correction: required
    positive_recovery_edges_minimum: 4
    edge_equal_mean_recovery_target: 0.70
  executable_design:
    theoretical_compute_fraction_of_Exact_All_min: 0.0
    theoretical_compute_fraction_of_Exact_All_max: 0.20
    discovery_recovery_at_least: 0.80
    stretch_recovery_at_least: 0.90
    full_Current_KV_or_future_label_in_estimator: prohibited

focused_canary:
  users: 32
  edges: all_five
  candidate_anchors: 32
  heldout_candidates: 32
  physical_gpus: [0, 1, 2, 3]
  parallelism: independent_UID_shards
  checkpoints_and_edges_within_rank: serial
  batch_size: 1
  on_correctness_failure: stop_and_retain_invalid_evidence
  resource_and_makespan_estimate_before_discovery: required

discovery_after_canary:
