contract: p7_yambda_stateful_suite_v1
status: p7_1_complete_p7_2_frozen
date_frozen: 2026-08-19

p7_0_scope:
  yambda_next_listen_sampled_reranking:
    long_kv_qualification: no_go
    decision_is_permanent: true
  yambda_as_state_evolution_platform:
    status: retained
  paper_hypothesis:
    status: unresolved
  candidate_engineering_on_old_next_item:
    status: permanently_stopped

authorization:
  model_training: false
  version_chain_training: false
  workload_manifest_generation: false
  allowed_now: [p7_3_base_and_residual_implementation, focused_contract_tests]
  next_gate: p7_3_implementation_and_regression_review

shared_invariants:
  source: yambda50m_v2
  same_chronological_trace: true
  same_snapshot_and_lineage_rules: true
  query_features_are_strictly_pre_query: true
  candidate_query_is_transient: true
  candidate_query_never_updates_persistent_kv: true
  simple_features_are_explicit_base_features_not_identifiability_exclusions: true
  quality_and_target_free_fidelity_manifests_are_separate: true
  no_posthoc_score_mixing: true
  no_h_or_s_based_workload_selection: true

p7_1_audit:
  script: scripts/audit_yambda_stateful_workloads.py
  inputs:
    - data/raw/yambda/flat/50m/listens.parquet
    - data/raw/yambda/flat/50m/likes.parquet
    - data/raw/yambda/flat/50m/dislikes.parquet
    - data/raw/yambda/artist_item_mapping.parquet
  output: results/data_audit/yambda50m_p7/stateful_workload_feasibility_v1.json
  does_not_train_or_score_hstu: true
  time_splits_seconds:
    train: [0, 17539200]       # [0d, 203d)
    development: [17539200, 18144000]  # [203d, 210d)
    qualification: [18144000, 18748800] # [210d, 217d)

  return_to_familiar:
    inactivity_gap_grid_seconds: [1800, 7200, 21600, 86400, 259200]
    recent_tokens: 32
    persistent_context_tokens: 512
    min_familiar_candidates: 2
    report:
      - session_start_requests
      - target_recent_seen_old_seen_unseen
      - familiar_candidate_counts
      - old_only_candidate_coverage
      - item_and_artist_count_recency_rank_diagnostics
    gap_freeze_rule: >-
      Choose the largest registered gap with at least 10000 rankable train,
      500 development, and 500 qualification requests. If none qualifies,
      Workload R is infeasible in this split. This rule uses coverage only and
      must not inspect H, S, or model scores.

  explicit_feedback:
    event_types: [like, dislike]
    causal_history_rule: listens_timestamp_strictly_less_than_feedback_timestamp
    recent_tokens: 32
    persistent_context_tokens: 512
    report:
      - temporal_coverage
      - causal_query_count
      - labels_per_user
      - candidate_history_position
      - latest_item_shortcut
      - same_session_target_shortcut
      - split_coverage
    prefer_explicit_if:
      min_causal_train_queries: 10000
      min_causal_development_queries: 500
      min_causal_qualification_queries: 500
      min_each_label_in_development: 100
      min_each_label_in_qualification: 100
      max_latest_item_fraction: 0.80
    fallback_if_failed: future_window_preference_requires_separate_contract

p7_1_result:
  evidence_level: full_data_development_feasibility_audit
  artifact: results/data_audit/yambda50m_p7/stateful_workload_feasibility_v1.json
  artifact_sha256: 1d6705ee7d1b0e991f307c5abf8a1fdfdc25b92e8c4031ec0f573164cdf244dc
  users_with_listens: 9238
  return_to_familiar:
    selected_gap_seconds: 259200
    selected_by: largest_registered_gap_meeting_coverage_only_rule
    rankable_requests: {train: 25639, development: 1189, qualification: 1281}
    familiar_candidate_median: {train: 278, development: 327, qualification: 329}
    old_only_candidate_positive_fraction:
      {train: 0.9338926397, development: 0.9743196627, qualification: 0.9696408738}
    optimistic_best_simple_feature_midrank_mean:
      {train: 0.1396595804, development: 0.1369636459, qualification: 0.1386892124}
    interpretation: >-
      Coverage supports a 3-day return workload. Simple count/recency features
      remain strong and therefore belong in the explicit base ranker; this is
      not an identifiability failure gate.
  explicit_feedback:
    selected: true
    causal_queries: {train: 491189, development: 18668, qualification: 19967}
    causal_dislikes: {train: 57148, development: 1886, qualification: 1865}
    latest_item_fraction: {development: 0.1187593743, qualification: 0.1229528722}
    prior_30m_target_listen_fraction: {development: 0.3234411828, qualification: 0.3269895327}
    coincident_target_listen_fraction_of_all_feedback:
      {development: 0.0813673568, qualification: 0.0906001699}
    causal_contract_excludes_coincident_listens: true
    interpretation: >-
      Explicit feedback passes coverage and latest-item shortcut gates. The
      substantial same-session companion is retained as a reported cohort;
      coincident listens are excluded from history by the strict-less-than
      timestamp rule.

forbidden:
  - reinterpret_p5_or_p6_as_passed
  - construct_fifth_next_item_negative_protocol
  - select_gap_from_h_or_s
  - select_feedback_variant_from_h_or_s
  - train_m0_or_m1_before_workload_suite_freeze
  - train_theta1_or_theta2_before_h_qualification
  - perturb_kv_or_projection_to_increase_staleness
