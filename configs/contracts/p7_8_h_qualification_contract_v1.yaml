contract: p7_8_h_qualification_contract_v1
date_frozen: 2026-08-20
depends_on: [p7_5_full_result_v1, p7_7_theta0_training_result_v1]
status: frozen_before_qualification_unlock
evidence_target: one_time_out_of_time_long_state_H_qualification

authorization:
  qualification_read_and_scoring: true_after_run_plan_is_sealed
  frozen_checkpoints: all_12_P7_7_checkpoints
  train_or_refit_any_model: false
  alter_workload_candidates_or_history: false
  theta1_theta2: false
  staleness_or_controller: false
  stop_after: adjudication_report_v1

model_roles:
  primary_workload_models:
    R: M0-R
    F: M0-F
  negative_control:
    N: M0-N
  shared_state_companions: [M1-N, M1-R, M1-F]
  selection_from_qualification_results: forbidden
  if_only_M1_passes: paper_scope_must_be_multitask_shared_persistent_state

seed_policy:
  qualification_scope: all_frozen_seeds
  seeds: [17, 37, 71]
  qualification_H_filtering: forbidden
  staleness_S_filtering: forbidden
  controller_result_filtering: forbidden
  per_seed_results_required: true
  seed_equal_aggregate_required: true
  inferential_units:
    within_seed: user
    across_training_repeats: seed
  release_admission:
    source: p7_7_frozen_prequalification_development_gates
    M0_rule: corresponding_task_deployment_loss_better_than_frozen_base
    M1_rule: every_task_better_than_no_information_and_R_or_F_better_than_base
    admitted_checkpoints: all_12
    note: no_per_task_M1_noninferiority_gate_was_frozen_before_qualification
    reporting: [all_seed_results, release_admitted_subset]
    current_subset_relation: release_admitted_subset_equals_all_seed_results
  interpretation:
    three_of_three_H_quality_positive: robust
    two_of_three_H_quality_positive_and_positive_aggregate: provisional
    one_of_three_H_quality_positive: isolated_mechanism_case
    zero_of_three_H_quality_positive: no_long_state_object

paths:
  qualification_inference_precision: float32_to_preserve_frozen_chunk_invariance
  full_history:
    tokens: 512
    reconstruction: frozen_last_512_strictly_causal_events
  recent_history:
    tokens: 32
    reconstruction: last_32_of_the_identical_full_causal_prefix
    first_retained_event_time_delta: 0
  base_logits:
    source: identical_frozen_candidate_features_and_frozen_base
    bitwise_identical_between_full_and_recent: required
  candidate_query_transient: true
  candidate_query_writes_persistent_KV: false
  residual_coefficient: 1.0

views:
  quality:
    N: quality
    R: quality_rankable
    F: quality
  target_free_fidelity:
    N: fidelity
    R_primary: fidelity_all_eligible
    R_companion: fidelity_rankable_companion
    F: fidelity
  compact_long_term_summary:
    included: false
    reason: no_summary_model_was_trained_and_frozen_before_qualification

target_free_H:
  comparison: Base_plus_Full512_CC_vs_Base_plus_Recent32_CC
  primary_endpoint: output_js_divergence
  definitions:
    N_R_output_distribution: softmax_over_the_complete_frozen_candidate_set
    F_output_distribution: Bernoulli_like_probability
    js_log_base: natural
    normalized_score_rms_N_R: per_request_centered_logit_delta_RMS_divided_by_full_centered_logit_RMS_plus_1e-6
    normalized_score_rms_F: population_logit_delta_RMS_divided_by_max_full_logit_std_1e-3
    pairwise_inversion_N_R: exact_fraction_of_candidate_pairs_with_different_order_half_credit_for_ties
    top10_overlap_loss_N_R: one_minus_intersection_over_10_or_candidate_count
    F_probability_companion: absolute_like_probability_difference
  companions:
    N_R: [normalized_score_rms, pairwise_inversion, top10_overlap_loss]
    F: [normalized_score_rms, absolute_probability_difference]
  numeric_floor:
    output_js_divergence: max_of_1e-8_and_10x_development_identity_canary
    other_metrics: max_of_1e-7_and_10x_development_identity_canary
    canary_must_be_frozen_in_run_plan_before_unlock: true
  repeatability:
    request_panels: 4
    assignment: sha256_request_id_mod_4
    minimum_panels_above_numeric_floor: 3
  not_scale_only:
    N_R: pairwise_inversion_or_top10_overlap_must_exceed_its_floor_or_primary_quality_must_improve
    F: absolute_probability_difference_must_exceed_its_floor

quality_endpoints:
  R:
    primary: within_request_pairwise_target_AUC
    direction: Full_minus_Recent_positive
    companions:
      target_hard_negative_margin: Full_minus_Recent_positive
      conditional_NDCG_at_10: Full_minus_Recent_positive
      conditional_HR_at_10: Full_minus_Recent_positive
      MRR: Full_minus_Recent_positive
    noninferiority_tolerance: {NDCG_at_10: -0.005, HR_at_10: -0.005, MRR: -0.005}
    required_population:
      eligible_session_starts: 2688
      rankable_familiar_returns: 1281
      conditional_coverage: 0.4765625
  F:
    primary: binary_log_loss
    direction: Recent_loss_minus_Full_loss_positive
    companions:
      ROC_AUC: Full_minus_Recent_positive
      dislike_PR_AUC: Full_minus_Recent_positive
      Brier: Recent_minus_Full_positive
    noninferiority_tolerance: {ROC_AUC: -0.005, dislike_PR_AUC: -0.01}
    required_cohorts:
      - prior_30m_same_item
      - non_prior_30m_same_item
      - latest_item
      - non_latest_item
      - long_gap_at_least_3d
      - short_gap_under_3d
      - like
      - dislike
      - organic
      - recommendation_driven
  N:
    role: negative_control
    metrics: [within_request_pairwise_target_AUC, target_hard_negative_margin, NDCG_at_10, HR_at_10, MRR]
    long_H_pass_required: false

statistics:
  user_aggregation: mean_requests_per_user_then_equal_user_mean
  bootstrap:
    per_seed_user_cluster_replicates: 2000
    seed_equal_hierarchical_replicates: 10000
    confidence_interval: percentile_95
    deterministic_namespace: p7-8-H-bootstrap-v1
  positive_primary_gate:
    seed_aggregate_CI_lower_gt_zero: true
    majority_seed_point_direction_positive: true
  seed_H_quality_positive:
    fidelity_primary_CI_lower_above_numeric_floor: true
    quality_primary_CI_lower_gt_zero: true
    companions_noninferior: true
  material_degradation:
    no_primary_workload_seed_may_have_quality_primary_CI_upper_lt_zero_by_more_than_its_tolerance: true

qualification_pass:
  R_primary_M0:
    - target_free_H_primary_aggregate_CI_above_floor
    - target_free_repeatability_and_not_scale_only
    - pairwise_target_AUC_aggregate_CI_lower_gt_zero
    - at_least_two_seed_point_effects_positive
    - NDCG_HR_MRR_aggregate_noninferior
    - coverage_reported
  F_primary_M0:
    - target_free_H_primary_aggregate_CI_above_floor
    - target_free_repeatability_and_not_scale_only
    - log_loss_aggregate_CI_lower_gt_zero
    - at_least_two_seed_point_effects_positive
    - ROC_AUC_and_dislike_PR_AUC_aggregate_noninferior
    - all_frozen_cohorts_reported
  version_chain_authorization:
    M0_R_or_M0_F: primary_workload_gate_passes
    M1_only: M1_condition_is_robust_or_provisional_under_the_same_seed_rules
    isolated_one_seed_case: tomography_only_no_version_chain_claim
    H_without_quality: no_version_chain
    no_R_or_F_H: no_version_chain

raw_score_artifacts:
  write_before_metrics: true
  format: parquet_zstd
  one_file_per_checkpoint_workload_view: true
  required_candidate_fields:
    - request_id
    - uid
    - candidate_id
    - candidate_position
    - base_logit
    - recent32_residual_logit
    - full512_residual_logit
    - recent32_deployment_logit
    - full512_deployment_logit
    - model_condition
    - seed
    - workload
    - manifest_view
  quality_only_fields: [target_index_or_label, target_and_feedback_cohorts]
  fidelity_forbidden_fields: [label, target_index, rankable, future_shortcut_fields]
  hash_every_file_before_metric_computation: true

reveal_policy:
  evaluate_all_12_checkpoints_in_one_run_family: true
  raw_artifacts_sealed_before_metric_computation: true
  one_unified_evaluator: true
  stop_after_adjudication: true
  prohibited_after_reveal:
    - retrain_seed
    - change_checkpoint
    - alter_task_weight
    - alter_history_length
    - refit_base
    - add_or_remove_cohort_gate
    - train_theta1_theta2_without_new_authorization
