  candidate_admission: prohibited
  lineage_promotion: prohibited

population:
  eligibility: at_least_512_listens_strictly_before_day231
  selector: ascending_existing_label_free_selector_rank_then_uid
  selected_count: 3000
  fixed_across_all_edges: true
  labels_read: prohibited
  split:
    purpose: cross_user_centroid_fit_and_evaluation_only
    algorithm: low_bit_of_sha256_namespace_and_decimal_uid
    namespace: evokv:recommendation-state-structure:v1
  history_snapshot: last_512_events_strictly_before_each_edge_cutover

observations:
  cross_user_state_delta:
    shared_items: top_1024_by_distinct_selected_user_count_per_edge
    item_tie_break: item_id_ascending
    stages:
      - item_embedding
      - combined_input
      - per_layer_normalized_input
      - per_layer_Q
      - per_layer_K
      - per_layer_V
      - per_layer_AV_before_output_projection
      - per_layer_attention_output
      - per_layer_U_gate
      - per_layer_gated_update
      - per_layer_hidden_output
    fit: train_split_item_and_item_action_centroids
    evaluation: held_out_user_split
    minimum_train_and_test_samples_per_item_action: 8
    metrics:
      - global_version_shift_R2_over_zero_delta
      - item_centroid_R2_over_zero_delta
      - item_excess_R2_over_global_version_shift
      - item_action_increment_over_item_centroid
  weighted_semantic_coreset:
    repair_scope: recent_128_positions
    carriers: 64
    represented_mass_per_carrier: 2
    common_prefix: Parent_exact_oldest_384_positions
    paths:
      - Parent_Reuse
      - Parent_prefix_plus_Current_dense_recent128
      - Parent_prefix_plus_Current_positional_pair_carriers
      - Parent_prefix_plus_Current_same_item_first_carriers
      - Parent_prefix_plus_Current_typed_item_action_first_carriers
    representative: later_occurrence_in_each_pair
    carrier_order: representative_position_ascending
    metrics:
      - absolute_probability_gap_to_Current_Exact
      - output_gap_recovery_over_Parent_Reuse
      - top1_agreement_with_Current_Exact
      - top10_overlap_with_Current_Exact
      - within_user_rank_correlation
  candidate_bank:
    recent_repeat: up_to_16_most_recent_unique_known_items_from_recent128
    old_only_repeat: up_to_16_most_recent_unique_known_items_from_old384_excluding_recent128
    novel_to_prefix: fill_the_fixed_64_panel_with_globally_frequent_known_history_items_absent_from_user_prefix
    rationale: preserve_all_3000_users_including_high_OOV_or_low_known_repeat_histories
    global_bank_source: selected_users_same_pre_cutover_history_only
    labels_or_negative_semantics: prohibited
    query_timestamp: edge_cutover
    metrics:
      - layerwise_candidate_influence_rank90
      - layerwise_candidate_influence_effective_rank
      - layerwise_exact_minus_reuse_influence_rank90
      - exact_minus_reuse_readout_effective_rank
      - mode_conditioned_influence_support
      - mode_conditioned_absolute_logit_shift

protocol:
  future_labels: prohibited
  target_current_kv_fitting: prohibited
  unexposed_candidate_as_negative: prohibited
  all_five_edges_reported: required
  fixed_population_count_must_equal_3000: true
  output_expanded_state_tensors: prohibited
  output_compact_aggregates_only: true
  focused_canary: required
  overwrite_existing_evidence: prohibited

