[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hstu-kvcache"
version = "0.0.1"
description = "Low-cost drift estimation for HSTU KV cache maintenance under streaming model updates"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "o1 project" }]
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E731", "E741", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
