<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="cohort" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="58" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">A model update invalidates persistent HSTU derived state</text>
  <text x="64" y="91" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">CohortKV transforms a fixed stale cohort; training and foreground serving remain outside the job.</text>

  <rect x="64" y="126" width="1152" height="512" rx="26" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="88" y="158" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.3">FIXED TARGET-VERSION UPDATE JOB</text>

  <g filter="url(#shadow)">
    <rect x="94" y="205" width="235" height="146" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="94" y="205" width="235" height="40" rx="18" fill="#e2e8f0"/>
    <rect x="94" y="228" width="235" height="17" fill="#e2e8f0"/>
    <text x="116" y="232" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#1e293b">Old model θᵥ</text>
    <text x="116" y="278" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">Persistent user prefix</text>
    <text x="116" y="305" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">old Norm(x) capsule</text>
    <text x="116" y="332" font-family="Inter,Arial,sans-serif" font-size="15" fill="#64748b">migration anchor = v</text>
  </g>

  <path d="M329 278 H413" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="347" y="261" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">cohort</text>

  <g filter="url(#shadow)">
    <rect x="424" y="188" width="360" height="326" rx="22" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
    <rect x="424" y="188" width="360" height="62" rx="20" fill="url(#cohort)"/>
    <rect x="424" y="227" width="360" height="23" fill="url(#cohort)"/>
    <text x="454" y="226" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">CohortKV</text>
    <text x="454" y="281" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">(source v, target t) program</text>
    <rect x="454" y="303" width="300" height="54" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="474" y="327" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#3730a3">1  Compile and certify repair</text>
    <text x="474" y="347" font-family="Inter,Arial,sans-serif" font-size="13" fill="#4f46e5">label-free semantic contract</text>
    <rect x="454" y="370" width="300" height="54" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="474" y="394" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">2  Transform capsule → K/V</text>
    <text x="474" y="414" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2563eb">one affine pass with valid-length mask</text>
    <rect x="454" y="437" width="300" height="54" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="474" y="461" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#0e7490">3  Publish complete target version</text>
    <text x="474" y="481" font-family="Inter,Arial,sans-serif" font-size="13" fill="#0891b2">explicit destination + atomic manifest</text>
  </g>

  <path d="M784 278 H875" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <g filter="url(#shadow)">
    <rect x="887" y="205" width="281" height="146" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="887" y="205" width="281" height="40" rx="18" fill="#dbeafe"/>
    <rect x="887" y="228" width="281" height="17" fill="#dbeafe"/>
    <text x="909" y="232" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">Target model θₜ state</text>
    <text x="909" y="278" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1e293b">Complete current-target K/V</text>
    <text x="909" y="305" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1e293b">version manifest</text>
    <text x="909" y="332" font-family="Inter,Arial,sans-serif" font-size="15" fill="#2563eb">served K/V target = t</text>
  </g>

  <g>
    <rect x="94" y="548" width="300" height="62" rx="14" fill="#fff1f2" stroke="#fda4af"/>
    <text x="116" y="574" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#9f1239">Endpoint A · stale reuse</text>
    <text x="116" y="596" font-family="Inter,Arial,sans-serif" font-size="14" fill="#be123c">low maintenance, mismatched semantics</text>
    <rect x="410" y="548" width="360" height="62" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="432" y="574" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#334155">CohortKV · compiled migration</text>
    <text x="432" y="596" font-family="Inter,Arial,sans-serif" font-size="14" fill="#475569">intermediate cost, certified current-model fidelity</text>
    <rect x="786" y="548" width="382" height="62" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <text x="808" y="574" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#166534">Endpoint B · exact recomputation</text>
    <text x="808" y="596" font-family="Inter,Arial,sans-serif" font-size="14" fill="#15803d">current K/V reference, full-history cost</text>
  </g>

  <rect x="925" y="120" width="243" height="47" rx="12" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="943" y="141" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e">Outside: streaming training</text>
  <text x="943" y="158" font-family="Inter,Arial,sans-serif" font-size="12" fill="#a16207">publishes θₜ checkpoint</text>
  <path d="M1047 167 V198" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text x="64" y="681" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">Not in scope: request arrivals, hotness, routing, training/serving co-location, or automatic destination selection.</text>
</svg>
