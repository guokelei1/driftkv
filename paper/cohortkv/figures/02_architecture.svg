<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg2)"/>
  <text x="60" y="56" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Version cohort is the execution unit across three layers</text>
  <text x="60" y="88" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">The cohort coordinates compilation, batching, placement, and publication—not a prediction of safe reuse.</text>

  <rect x="60" y="116" width="1160" height="58" rx="16" fill="#1e293b"/>
  <text x="88" y="151" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">Cohort identity</text>
  <rect x="263" y="127" width="338" height="36" rx="10" fill="#334155" stroke="#64748b"/>
  <text x="285" y="151" font-family="ui-monospace,SFMono-Regular,monospace" font-size="17" fill="#e2e8f0">(migration anchor v, target t)</text>
  <text x="643" y="151" font-family="Inter,Arial,sans-serif" font-size="15" fill="#cbd5e1">same key carried by program, capsule, extent, and manifest</text>

  <g filter="url(#shadow2)">
    <rect x="60" y="207" width="340" height="375" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
    <rect x="60" y="207" width="340" height="61" rx="20" fill="#7c3aed"/>
    <rect x="60" y="246" width="340" height="22" fill="#7c3aed"/>
    <circle cx="94" cy="237" r="18" fill="#ffffff" fill-opacity="0.18"/>
    <text x="89" y="244" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">1</text>
    <text x="126" y="244" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Cohort compiler</text>
    <text x="87" y="307" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">INPUTS</text>
    <text x="87" y="337" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">old/current checkpoints</text>
    <text x="87" y="362" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">disjoint semantic probes</text>
    <text x="87" y="387" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">cost and fidelity contract</text>
    <rect x="87" y="416" width="286" height="86" rx="13" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="105" y="443" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#5b21b6">Fit fresh − cheap residual</text>
    <text x="105" y="468" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6d28d9">fold into affine Ŵ, b̂</text>
    <text x="105" y="489" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6d28d9">certify without task labels</text>
    <text x="87" y="535" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">OUTPUT</text>
    <text x="87" y="562" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">selected program + fallback plan</text>
  </g>

  <path d="M400 395 H458" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a2)"/>

  <g filter="url(#shadow2)">
    <rect x="470" y="207" width="340" height="375" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="470" y="207" width="340" height="61" rx="20" fill="#2563eb"/>
    <rect x="470" y="246" width="340" height="22" fill="#2563eb"/>
    <circle cx="504" cy="237" r="18" fill="#ffffff" fill-opacity="0.18"/>
    <text x="499" y="244" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">2</text>
    <text x="536" y="244" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Capsule-to-K/V operator</text>
    <text x="497" y="307" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">CONTRACT</text>
    <text x="497" y="337" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15" fill="#334155">[L,B,S,H] old Norm(x)</text>
    <text x="497" y="362" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">program source must match anchor</text>
    <rect x="497" y="394" width="286" height="109" rx="13" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="515" y="422" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">One fused pass</text>
    <text x="515" y="447" font-family="Inter,Arial,sans-serif" font-size="14" fill="#1d4ed8">affine projection + bias</text>
    <text x="515" y="470" font-family="Inter,Arial,sans-serif" font-size="14" fill="#1d4ed8">valid-length mask + K/V split</text>
    <text x="515" y="491" font-family="Inter,Arial,sans-serif" font-size="14" fill="#1d4ed8">direct contiguous output</text>
    <text x="497" y="535" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">OUTPUT</text>
    <text x="497" y="562" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">destination-ready target K/V extent</text>
  </g>

  <path d="M810 395 H868" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a2)"/>

  <g filter="url(#shadow2)">
    <rect x="880" y="207" width="340" height="375" rx="22" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="880" y="207" width="340" height="61" rx="20" fill="#0f766e"/>
    <rect x="880" y="246" width="340" height="22" fill="#0f766e"/>
    <circle cx="914" cy="237" r="18" fill="#ffffff" fill-opacity="0.18"/>
    <text x="909" y="244" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">3</text>
    <text x="946" y="244" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Destination engine</text>
    <text x="907" y="307" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f766e">EXECUTION</text>
    <text x="907" y="337" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">resident programs per GPU</text>
    <text x="907" y="362" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">bounded host waves + backpressure</text>
    <text x="907" y="387" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">byte-weighted extent placement</text>
    <g>
      <rect x="907" y="416" width="125" height="34" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
      <text x="947" y="438" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#047857">HBM</text>
      <rect x="1045" y="416" width="125" height="34" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
      <text x="1083" y="438" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#047857">DRAM</text>
      <rect x="907" y="462" width="125" height="34" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
      <text x="939" y="484" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f766e">POSIX</text>
      <rect x="1045" y="462" width="125" height="34" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
      <text x="1076" y="484" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f766e">REMOTE</text>
    </g>
    <rect x="907" y="521" width="263" height="42" rx="10" fill="#ccfbf1" stroke="#2dd4bf"/>
    <text x="925" y="547" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#115e59">manifest visible after full coverage</text>
  </g>

  <rect x="60" y="619" width="1160" height="55" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="84" y="652" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#9a3412">No admission oracle:</text>
  <text x="245" y="652" font-family="Inter,Arial,sans-serif" font-size="15" fill="#7c2d12">every stale cohort receives compiled repair; plans record stronger replay/exact fallbacks, but automatic dispatch is open.</text>
</svg>
